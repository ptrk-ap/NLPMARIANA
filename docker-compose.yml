version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nlpmariana_app
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${DB_USER:-mariana}:${DB_PASS:-123456}@db:5432/${DB_NAME:-principal}
      - API_USERNAME=${API_USERNAME}
      - API_PASSWORD=${API_PASSWORD}
      - TRIGGER_USERNAME=${TRIGGER_USERNAME}
      - TRIGGER_PASSWORD=${TRIGGER_PASSWORD}
      - DB_SSL=${DB_SSL:-false}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: nlpmariana_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-mariana}
      POSTGRES_PASSWORD: ${DB_PASS:-123456}
      POSTGRES_DB: ${DB_NAME:-principal}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mariana} -d ${DB_NAME:-principal}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:

